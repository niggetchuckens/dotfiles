##############################
### WINDOWS AND WORKSPACES ###
##############################

# Allow games to bypass the compositor
allow_tearing = true

##############################
###       APPEARANCE       ###
##############################

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    
    # Catppuccin Mocha: Purple to Blue gradient (matches waybar theme)
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(1e1e2eff)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 0
        color = rgba(00000000)
    }

    blur {
        enabled = false
        size = 1
        passes = 1
        vibrancy = 0.0
        ignore_opacity = false
    }
}

animations {
    enabled = no
}

